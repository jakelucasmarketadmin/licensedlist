# Cloudflare Pages project for LicensedList. The site runs as Pages Functions
# (server-rendered Astro) with its data in D1.
name = "licensedlist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "licensedlist"
database_id = "13dc84b4-65b9-4fb0-bd1c-b79a3e4a9477"
migrations_dir = "migrations"
